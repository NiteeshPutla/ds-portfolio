[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-portfolio"
version = "0.1.0"
description = "Data Science Portfolio Project covering all JD requirements for Data Scientist role"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Niteesh Putla", email = "niteeshputla@example.com" }
]
dependencies = [
    # Core Data Science
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.13.0",

    # ML/DL
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",

    # NLP/LLM
    "transformers>=4.38.0",
    "accelerate>=0.27.0",
    "tokenizers>=0.15.0",
    "sentence-transformers>=2.5.0",

    # LLM APIs
    "openai>=1.12.0",
    "anthropic>=0.21.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",

    # Prompt Engineering
    "instructor>=1.1.0",
    "pydantic>=2.6.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0",
    "bokeh>=3.4.0",

    # Jupyter
    "jupyter>=1.0.0",
    "jupyterlab>=4.2.0",
    "ipywidgets>=8.1.0",
    "nbformat>=5.9.0",

    # Data Processing
    "polars>=1.2.0",
    "pyarrow>=14.0.0",
    "duckdb>=0.10.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "loguru>=0.7.0",
    "tqdm>=4.66.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.2.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]
eval = [
    "langchain-eval>=0.0.10",
    "ragas>=0.1.0",
    "deepeval>=1.0.0",
]

[project.scripts]
ds-portfolio = "src.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ds_portfolio*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]